
name: Build JAROS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and extract project archive
        run: |
          ARCHIVE=$(find . -maxdepth 1 -iname 'JAROS*Cloud*Build*.zip' -print -quit)
          if [ -z "$ARCHIVE" ]; then
            echo "Project ZIP archive not found"
            exit 1
          fi
          unzip -o "$ARCHIVE" -d .

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JAROS-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
